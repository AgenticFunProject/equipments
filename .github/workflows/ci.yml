name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  node:
    name: Node 22 build and tests
    runs-on: ubuntu-latest
    outputs:
      playwright_report_available: ${{ steps.playwright-report.outputs.available }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Non-Gherkin tests
        run: npm run test:non-gherkin

      - name: Gherkin feature tests
        run: npm run test:gherkin

      - name: Install Playwright browser dependencies
        run: npm run test:ui:install

      - name: Browser playground UI tests
        run: npm run test:ui

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Prepare Playwright report for Pages
        id: playwright-report
        if: always()
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && ( "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/master" ) && -f playwright-report/index.html ]]; then
            mkdir -p playwright-report-pages
            cp -R playwright-report/. playwright-report-pages/
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Playwright report Pages artifact
        if: always() && steps.playwright-report.outputs.available == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: playwright-report-pages

  deploy-playwright-report:
    name: Publish Playwright report
    needs: node
    if: ${{ always() && needs.node.result != 'cancelled' && needs.node.outputs.playwright_report_available == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy Playwright report
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Add report link to summary
        run: |
          {
            echo "### Playwright report"
            echo ""
            echo "[Open the browser UI test report](${{ steps.deployment.outputs.page_url }})"
            echo ""
            echo "The downloadable \`playwright-artifacts\` artifact is still kept as a per-run fallback with traces and videos."
          } >> "$GITHUB_STEP_SUMMARY"
